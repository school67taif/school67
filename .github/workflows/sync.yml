name: sync
on:
  push:
    branches: [main, gh-pages]
permissions:
  contents: write
concurrency:
  group: sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git config user.name school67taif
          git config user.email school67taif@users.noreply.github.com
          git fetch origin main gh-pages
          git checkout -B s origin/main
          git merge --no-edit origin/gh-pages || { git merge --abort; git merge -X theirs --no-edit origin/gh-pages; }
          python3 .github/scripts/build_links.py || true
          python3 .github/scripts/autofix.py || true
          git add f/links.json || true
          git add -A f || true
          git diff --cached --quiet || git commit -m "تحديث الملفات والروابط تلقائياً"
          git push origin s:main s:gh-pages
