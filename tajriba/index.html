<script>(function(){"use strict";var CAT=JSON.parse(document.getElementById("cat").textContent),A=document.getElementById("app"),K="srs_demo_v1";

async function sha(x){var b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(x));return Array.from(new Uint8Array(b)).map(function(v){return ("0"+v.toString(16)).slice(-2)}).join("")}

  document.getElementById("list").innerHTML=o||'<div class="c muted">لا توجد نتائج</div>';[].forEach.call(document.querySelectorAll(".card"),function(e){e.onclick=function(){rec(e.dataset.n)}})}
